<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para mi Reina Emily</title>

<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(to top, #ff9966, #ff5e62, #1a2a6c);
    font-family: Arial, sans-serif;
}

/* Mar */
.mar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 30%;
    background: linear-gradient(to top, #003366, #005c99);
}

/* Texto en el cielo */
.mensaje {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    font-size: 3em;
    color: white;
    text-shadow: 0 0 20px #fff, 0 0 40px #ff99cc;
    animation: brillo 2s infinite alternate;
}

@keyframes brillo {
    from { opacity: 0.7; }
    to { opacity: 1; }
}

/* Estrellas fugaces */
.estrella {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    box-shadow: 0 0 10px white;
    animation: caer 3s linear infinite;
}

@keyframes caer {
    0% {
        transform: translate(0,0);
        opacity: 1;
    }
    100% {
        transform: translate(-400px, 400px);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="mensaje">Eres mi todo 💖</div>
<div class="mar"></div>

<script>
function crearEstrella() {
    const estrella = document.createElement("div");
    estrella.classList.add("estrella");

    estrella.style.top = Math.random() * 50 + "vh";
    estrella.style.left = Math.random() * 100 + "vw";
    estrella.style.animationDuration = (2 + Math.random() * 2) + "s";

    document.body.appendChild(estrella);

    setTimeout(() => {
        estrella.remove();
    }, 3000);
}

setInterval(crearEstrella, 500);
</script>

</body>
</html>
